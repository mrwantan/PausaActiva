<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="figures.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #w { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .fig { max-width: 100%; max-height: 100%; }
</style>
</head>
<body>
<div id="w"></div>
<script src="exercises.js"></script>
<script>
  var q = {};
  location.hash.slice(1).split('&').forEach(function (p) { var kv = p.split('='); q[kv[0]] = decodeURIComponent(kv[1] || ''); });
  var r = document.documentElement.style;
  r.setProperty('--ink', '#' + q.ink);
  r.setProperty('--surface', '#' + q.surface);
  r.setProperty('--tone', '#' + q.tone);
  r.setProperty('--p-gray', '#' + q.tone);
  r.setProperty('--font', 'sans-serif');
  var ex = (window.EXERCISES || []).filter(function (e) { return e.id === q.id; })[0];
  if (ex) document.getElementById('w').innerHTML = ex.svg;
  window.setRun = function (on) {
    document.querySelectorAll('.fig .a').forEach(function (el) { el.style.animationPlayState = on ? 'running' : 'paused'; });
  };
</script>
</body>
</html>
